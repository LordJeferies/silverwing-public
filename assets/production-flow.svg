<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc"><title id="title">Silverwing — del conocimiento al contenido</title><desc id="desc">Cuatro etapas: fuente autorizada, dirección editorial, producción humana e IA, aprobación y entregas semanales.</desc><rect width="1400" height="460" rx="28" fill="#101923"/><g fill="#fff" font-family="Arial,sans-serif"><text x="60" y="70" font-size="14" letter-spacing="3">SILVERWING / POWERED BY ABRAXAS</text><text x="60" y="130" font-size="40">Una fuente. Un sistema completo.</text></g><g fill="#1d2c40" stroke="#587498"><rect x="60" y="190" width="285" height="205" rx="20"/><rect x="390" y="190" width="285" height="205" rx="20"/><rect x="720" y="190" width="285" height="205" rx="20"/><rect x="1050" y="190" width="285" height="205" rx="20"/></g><g fill="#c4dcff" font-family="Arial,sans-serif" font-size="24"><text x="86" y="235">01 / Conocimiento</text><text x="416" y="235">02 / Dirección</text><text x="746" y="235">03 / Producción</text><text x="1076" y="235">04 / Aprobación</text></g><g fill="#e1e9f4" font-family="Arial,sans-serif" font-size="17"><text x="86" y="285">Material existente, guiones</text><text x="86" y="313">o entrevistas remotas.</text><text x="416" y="285">Temas, hooks y formatos.</text><text x="416" y="313">El experto valida.</text><text x="746" y="285">Edición, diseño e IA.</text><text x="746" y="313">QA humano y permisos.</text><text x="1076" y="285">Revisión consolidada.</text><text x="1076" y="313">Entrega por lotes.</text></g><g fill="#f0d054" font-size="26"><text x="354" y="300">→</text><text x="684" y="300">→</text><text x="1014" y="300">→</text></g></svg>
